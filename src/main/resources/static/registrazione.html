<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-container">
    <h2>Crea un account</h2>

    <!-- Invia a login.html per simulare la registrazione completata -->
    <form action="login.html" method="get">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="cognome">Cognome:</label>
            <input type="text" id="cognome" name="cognome" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="username">Username (min. 4 caratteri):</label>
            <input type="text" id="username" name="username" minlength="4" required>
        </div>

        <div class="form-group">
            <label for="password">Password (min. 6 caratteri):</label>
            <input type="password" id="password" name="password" minlength="6" required>
        </div>

        <button type="submit">Registrati</button>
    </form>

    <p>Hai già un account? <a href="login.html">Accedi qui</a></p>
</main>

</body>
</html>
